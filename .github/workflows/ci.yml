name: CI

# The gate every change passes, whether it came from a human, Renovate or the
# Minecraft bump job. Compilation and unit tests are necessary but not
# sufficient for this plugin — see .github/scripts/smoke-test.sh for why the
# boot check is the step that actually protects the shaded jar.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Read straight from the catalog rather than hardcoded here: paper-api
      # dictates the Java version, and a toolchain older than the one its module
      # metadata declares cannot resolve the compile classpath at all.
      - name: Resolve Java toolchain
        id: jdk
        run: |
          echo "version=$(sed -n 's/^jdk[[:space:]]*=[[:space:]]*"\(.*\)"[[:space:]]*$/\1/p' gradle/libs.versions.toml | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.jdk.outputs.version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.jdk.outputs.version }}
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Only the default branch writes the shared dependency cache; PR runs
          # read it. Keeps a fork PR from poisoning the cache for main.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Resolve target Minecraft version
        id: versions
        run: |
          echo "minecraft=$(./gradlew -q printMinecraftVersion --console=plain | tail -n1)" >> "$GITHUB_OUTPUT"
          echo "paperApi=$(./gradlew -q printPaperApiVersion --console=plain | tail -n1)" >> "$GITHUB_OUTPUT"
          echo "plugin=$(./gradlew -q printProjectVersion --console=plain | tail -n1)" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Cache Paper server jars
        uses: actions/cache@v4
        with:
          path: ~/.cache/paper
          key: paper-${{ steps.versions.outputs.minecraft }}
          restore-keys: paper-

      - name: Boot smoke test
        run: .github/scripts/smoke-test.sh --mc "${{ steps.versions.outputs.minecraft }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### LoafyLib ${{ steps.versions.outputs.plugin }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| paper-api | \`${{ steps.versions.outputs.paperApi }}\` |"
            echo "| Minecraft | \`${{ steps.versions.outputs.minecraft }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: LoafyLib-${{ steps.versions.outputs.plugin }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload boot log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-boot-log
          path: .smoke/boot.log
          if-no-files-found: ignore
          retention-days: 7

      # Gradle's console output reduces a test failure to a class name and a
      # line number. The assertion message, the actual-vs-expected values and
      # the seed needed to reproduce a property test all live in the report, so
      # without this an intermittent failure cannot be diagnosed after the fact
      # -- only re-run and hoped away.
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: ignore
          retention-days: 7

  rolling-latest:
    name: Publish rolling latest build
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: LoafyLib-*
          merge-multiple: true
          path: dist

      # A stable download URL for the newest green build of main, so the sibling
      # Loafy plugins can pull a fresh LoafyLib without waiting for a release.
      # Marked as a prerelease so it never shadows a real version.
      - name: Update the `latest` prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/*.jar \
            --prerelease \
            --title "Latest build (main)" \
            --notes "Automatically published from \`main\` @ ${GITHUB_SHA:0:7}. Unversioned rolling build — use a tagged release for anything stable."
